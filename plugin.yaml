name: idle-compact
version: 0.9.54
description: "Background compression of idle sessions before prompt-cache expiry (beta)."
author: "npetroff24"
kind: standalone
provides_hooks: ["on_session_end", "post_api_request", "pre_api_request", "post_compaction"]
provides_middleware: ["llm_execution"]
python_dependencies: ["pyyaml", "httpx"]
config_schema:
  idle_gate_ratio:
    type: float
    default: 0.5
    label: "Idle auto-compact gate (fraction of the core compression threshold)"
    description: "Share of the core compression threshold that triggers background idle compaction (0.5 = half the threshold). Lower = earlier and more often. Applies after Save."
