name: idle-compact
version: 0.9.23
description: "Background compression of idle sessions before prompt-cache expiry (beta)."
author: "custom"
kind: standalone
provides_hooks: ["on_session_end", "post_api_request", "pre_api_request"]
provides_middleware: ["llm_execution"]
python_dependencies: ["pyyaml"]
config_schema:
  auto_compact_ratio:
    type: float
    default: 0.2
    label: "Auto-compact threshold (fraction of model window)"
    description: "Share of the model window that triggers background compression (0.2 = 20%). Lower = earlier and more often. Applies after Save; if empty, the gate is the core compression target × 2."
